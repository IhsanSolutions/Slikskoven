events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index forside.html;

        # VIGTIGT I DOCKER:
        # Redirects skal være relative, så browseren beholder
        # den eksterne port, fx localhost:8081.


        absolute_redirect off;

        # ==================================================
        # RENE OFFENTLIGE URL'ER
        # ==================================================

        location = / {
            try_files /forside.html =404;
        }

        location = /nyheder {
            try_files /news.html =404;
        }

        location = /produkter {
            try_files /products.html =404;
        }

        location = /bestil {
            try_files /order.html =404;
        }

        location = /log-ind {
            try_files /login.html =404;
        }

        location = /opret-bruger {
            try_files /register.html =404;
        }

        # ==================================================
        # RENE ADMIN-URL'ER
        # ==================================================

        location = /admin {
            try_files /admin/adminDashboard.html =404;
        }

        location = /admin/nyheder {
            try_files /admin/adminNews.html =404;
        }

        location = /admin/produkter {
            try_files /admin/adminProducts.html =404;
        }

        location = /admin/ordrer {
            try_files /admin/adminOrders.html =404;
        }

        # ==================================================
        # TRAILING SLASH → KANONISK URL
        # 302 bruges under lokal udvikling for at undgå cachede redirects.
        # ==================================================

        location = /nyheder/ {
            return 302 /nyheder$is_args$args;
        }

        location = /produkter/ {
            return 302 /produkter$is_args$args;
        }

        location = /bestil/ {
            return 302 /bestil$is_args$args;
        }

        location = /log-ind/ {
            return 302 /log-ind$is_args$args;
        }

        location = /opret-bruger/ {
            return 302 /opret-bruger$is_args$args;
        }

        location = /admin/ {
            return 302 /admin$is_args$args;
        }

        location = /admin/nyheder/ {
            return 302 /admin/nyheder$is_args$args;
        }

        location = /admin/produkter/ {
            return 302 /admin/produkter$is_args$args;
        }

        location = /admin/ordrer/ {
            return 302 /admin/ordrer$is_args$args;
        }

        # ==================================================
        # GAMLE URL'ER → RENE URL'ER
        # 302 bruges under lokal udvikling for at undgå cachede redirects.
        # Query-parametre bevares.
        # ==================================================

        location = /forside.html {
            return 302 /$is_args$args;
        }

        location = /news.html {
            return 302 /nyheder$is_args$args;
        }

        location = /products.html {
            return 302 /produkter$is_args$args;
        }

        location = /order.html {
            return 302 /bestil$is_args$args;
        }

        location = /login.html {
            return 302 /log-ind$is_args$args;
        }

        location = /register.html {
            return 302 /opret-bruger$is_args$args;
        }

        location = /admin/adminDashboard.html {
            return 302 /admin$is_args$args;
        }

        location = /admin/adminNews.html {
            return 302 /admin/nyheder$is_args$args;
        }

        location = /admin/adminProducts.html {
            return 302 /admin/produkter$is_args$args;
        }

        location = /admin/adminOrders.html {
            return 302 /admin/ordrer$is_args$args;
        }

        # ==================================================
        # BACKEND
        # ==================================================

        location /api/ {
            proxy_pass http://backend:8080;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Spring Security behandler login gennem POST /login.
        # Selve login-siden ligger på /log-ind.
        location = /login {
            proxy_pass http://backend:8080/login;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location = /logout {
            proxy_pass http://backend:8080/logout;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Statiske filer som /styles, /js og /assets.
        # Ukendte URL'er giver 404 i stedet for at vise forsiden.
        location / {
            try_files $uri =404;
        }

        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
    }
}